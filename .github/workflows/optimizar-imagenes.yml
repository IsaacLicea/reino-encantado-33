name: Optimizar imágenes del Reino
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimizar-imagenes.yml'
      - 'assets/**/*.png'
      - 'scripts/optimizar_imagenes.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convertir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar compresor
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Optimizar las imágenes y actualizar las rutas
        run: python scripts/optimizar_imagenes.py
      - name: Guardar versiones ligeras en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ index.html sendero.css efectos-magicos.js
          if git diff --cached --quiet; then
            echo "Sin cambios de imágenes."
          else
            git commit -m "Optimizar imágenes PNG a WebP para móviles"
            git push origin HEAD:main
          fi
