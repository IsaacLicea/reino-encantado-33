name: Integrar World_OP2 (CC BY 4.0)
on:
  push:
    branches: [feature/peritune-world-op2]
    paths:
      - '.github/workflows/descargar-world-op2.yml'
      - 'scripts/descargar_world_op2.py'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check requests
      - name: Obtener World_OP2 con autorización CC BY 4.0
        run: python scripts/descargar_world_op2.py
      - name: Validar grabación final y atribución
        run: |
          test -s assets/peritune-world-op2.mp3
          test -s MUSICA-WORLD-OP2.md
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/peritune-world-op2.mp3
      - name: Guardar únicamente el MP3 autorizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/peritune-world-op2.mp3
          if git diff --cached --quiet; then
            echo "Audio sin cambios"
          else
            git commit -m "Añadir World_OP2 de PeriTune (CC BY 4.0)"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
