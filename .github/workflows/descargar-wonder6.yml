name: Integrar Wonder6 de PeriTune (CC BY 4.0)
on:
  push:
    branches: [feature/peritune-wonder6-ccby]
    paths:
      - '.github/workflows/descargar-wonder6.yml'
      - 'scripts/descargar_wonder6.py'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar herramientas de verificación
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check requests beautifulsoup4
          ffprobe -version | head -n 1
      - name: Descargar y verificar MP3 oficial Wonder6
        run: python scripts/descargar_wonder6.py
      - name: Comprobar licencia y pista
        run: |
          test -s assets/peritune-wonder6.mp3
          test -f MUSICA-WONDER6.md
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/peritune-wonder6.mp3
      - name: Guardar Wonder6 en la rama para integrarlo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/peritune-wonder6.mp3
          if git diff --cached --quiet; then
            echo "Wonder6 ya está guardada."
          else
            git commit -m "Guardar Wonder6 con licencia CC BY 4.0"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
