name: Optimizar preview de WhatsApp
on:
  push:
    branches: [fix/preview-whatsapp-rendimiento]
    paths:
      - '.github/workflows/preview-whatsapp.yml'
      - 'scripts/optimizar_preview_whatsapp.py'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  optimizar-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Crear JPEG ligero y verificar resolución
        run: python scripts/optimizar_preview_whatsapp.py
      - name: Guardar asset versionado para invalidar cache de WhatsApp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og-reino-33-wa-v2.jpg
          if git diff --cached --quiet; then
            echo "La imagen ya se encontraba actualizada."
          else
            git commit -m "Añadir preview de WhatsApp ligero y versionado"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
